# Pruebas en cada pull request (a main o develop) y en cada push a main.
#
# El deploy lo sigue haciendo Vercel automáticamente desde main. Para que a
# main solo llegue código probado, la rama main debe exigir este check
# ("Pruebas") en su regla de protección (Settings → Branches / Rulesets).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test
